<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:if condition="{vocabulary}"><f:then>{vocabulary.title}</f:then><f:else>Taxonomy</f:else></f:if></h1>
    <f:flashMessages queueIdentifier="{flashMessageQueueIdentifier}" />

    <f:if condition="{page}">
        <f:then>
            <f:if condition="{canList}">
                <f:then>
                    <table class="table table-striped table-hover taxonomy-terms" data-sort-url="{sortUrl}" data-can-sort="{canModify}">
                        <thead>
                            <tr>
                                <th class="col-icon" aria-label="Move"></th>
                                <th>Title</th>
                                <th class="col-control" aria-label="Actions"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <f:for each="{terms}" as="term">
                                <tr data-uid="{term.uid}" data-parent="{term.parent}" data-depth="{term.depth}">
                                    <td class="col-icon">
                                        <f:if condition="{canModify}">
                                            <button type="button" class="btn btn-default btn-sm taxonomy-drag-handle" title="Move">
                                                <core:icon identifier="actions-move" size="small" />
                                            </button>
                                        </f:if>
                                    </td>
                                    <td>
                                        <span class="taxonomy-term-title" style="padding-left: {term.indent}px">{term.title}</span>
                                    </td>
                                    <td class="col-control">
                                        <f:if condition="{canModify}">
                                            <div class="btn-group" role="group">
                                                <a href="{term.editUrl}" class="btn btn-default" title="Edit">
                                                    <core:icon identifier="actions-open" size="small" />
                                                </a>
                                                <a href="{term.deleteUrl}" class="btn btn-default t3js-taxonomy-delete" title="Delete" data-title="Delete this record?" data-message="Are you sure you want to delete the term '{term.title}'?">
                                                    <core:icon identifier="actions-edit-delete" size="small" />
                                                </a>
                                            </div>
                                        </f:if>
                                    </td>
                                </tr>
                            </f:for>
                        </tbody>
                    </table>
                </f:then>
                <f:else>
                    <div class="alert alert-warning">You are not allowed to list terms.</div>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <div class="alert alert-info">Please select a taxonomy folder</div>
        </f:else>
    </f:if>
</f:section>
